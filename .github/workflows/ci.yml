name: FlowOps verification

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true

      - name: Backend tests
        working-directory: backend
        run: ./gradlew test --console=plain

      - uses: actions/setup-node@v4
        with:
          node-version: '20.20.2'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json

      - name: Frontend verification
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm test -- --run
          npm run build

      - name: Install browser
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Compose and E2E
        run: |
          docker compose down --volumes
          docker compose up --build --detach
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/actuator/health | grep -q '"status":"UP"'; then
              break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:4173/actuator/health | grep -q '"status":"UP"'
          npm --prefix e2e test

      - name: Public-safety checks
        run: |
          ./scripts/test/check-local-demo-network-compose-cli.sh
          ./scripts/check-local-demo-network.sh
          ./scripts/check-no-browser-auth-storage.sh
          ./scripts/check-public-safety.sh

      - name: Compose logs on failure
        if: failure()
        run: docker compose logs --no-color
